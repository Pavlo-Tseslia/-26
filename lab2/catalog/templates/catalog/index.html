{% extends 'catalog/base.html' %}

{% block content %}
<div class="hero-section" style="text-align: center; padding: 40px 0; background: url('https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=2070&auto=format&fit=crop'); background-size: cover;">
    <div style="background: rgba(0,0,0,0.5); padding: 40px; border-radius: 15px; color: white;">
        <h1 style="border: none;">Смак справжньої Італії у вашому домі</h1>
        <p>Найкраща піца на дровах та домашня паста</p>
        <a href="{% url 'menu' %}" class="btn" style="background: #cd212a;">Відкрити меню</a>
    </div>
</div>

<h2>Популярні категорії:</h2>
<div style="display: flex; gap: 20px; justify-content: center;">
    {% for cat in categories %}
        <div style="padding: 20px; border: 1px solid #ddd; border-radius: 10px; width: 150px; text-align: center;">
            {# Додаємо якір # до посилання на меню #}
            <a href="{% url 'menu' %}#{% if 'Піца' in cat.name %}pizza{% elif 'Паста' in cat.name %}pasta{% else %}drinks{% endif %}"
                style="text-decoration: none; color: #333; font-weight: bold;">
                {{ cat.name }}
            </a>
        </div>
    {% endfor %}
</div>
{% endblock %}
