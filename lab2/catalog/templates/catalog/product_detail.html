<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

{% extends 'catalog/base.html' %}
{% block content %}
<h2>{{ product.title }}</h2>
{% if product.image %}
    <img src="{{ product.image.url }}" alt="{{ product.title }}" style="max-width: 300px;">
{% endif %}
<p><strong>Опис:</strong> {{ product.description }}</p>
<p><strong>Ціна:</strong> {{ product.price }} грн</p>
<button disabled>Купити</button>
<br><br>
<a href="{% url 'index' %}">Повернутися на головну</a>
{% endblock %}

</body>
</html>
