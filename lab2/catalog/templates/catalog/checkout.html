{% extends 'catalog/base.html' %}

{% block content %}
<h1>Оформлення замовлення</h1>

<form method="post">
    {% csrf_token %}
    <div class="form-group">
        <label>Ваше повне ім'я:</label>
        <input type="text" name="full_name" required>
    </div>

    <div class="form-group">
        <label>Спосіб доставки:</label>
        <select name="delivery">
            <option value="PICKUP">Самовивіз</option>
            <option value="COURIER">Доставка кур'єром (Італійський квартал)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Адреса (якщо кур'єр):</label>
        <input type="text" name="address">
    </div>

    <div class="form-group">
        <label>Спосіб оплати:</label>
        <select name="payment">
            <option value="CASH">Готівка при отриманні</option>
            <option value="CARD">Картою кур'єру</option>
            <option value="ONLINE">Оплата онлайн (LiqPay/Stripe)</option>
        </select>
    </div>

    <button type="submit" class="btn-confirm">Підтвердити замовлення</button>
</form>
{% endblock %}
