{% extends 'catalog/base.html' %}

{% block content %}
<div class="container" style="max-width: 400px; padding: 40px 0;">
    <h2>Реєстрація клієнта</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="background: #cd212a; color: white;">Зареєструватися</button>
    </form>
    <p>Вже є акаунт? <a href="{% url 'login' %}">Увійти тут</a></p>
</div>
{% endblock %}
