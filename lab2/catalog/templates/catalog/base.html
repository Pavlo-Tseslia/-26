<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мій Сайт{% endblock %}</title>
    <style>
        header { background: #f4f4f4; padding: 20px; text-align: center; }
        footer { background: #333; color: white; padding: 20px; text-align: center; margin-top: 50px; }
        nav a { margin: 0 15px; text-decoration: none; font-weight: bold; }
        .container { width: 80%; margin: 0 auto; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'index' %}">Головна</a>
            <a href="{% url 'about' %}">Про нас</a>
            <a href="{% url 'contact' %}">Контакти</a>
        </nav>
    </header>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p>&copy; 2026 Універсальний каталог товарів. Всі права захищені.</p>
    </footer>

<nav>
    <a href="{% url 'index' %}">Головна</a>
    <a href="{% url 'about' %}">Про нас</a>
    <a href="{% url 'contact' %}">Контакти</a>
    |
    {% if user.is_authenticated %}
        <a href="{% url 'profile' %}">Особистий кабінет ({{ user.username }})</a>
        <form action="{% url 'logout' %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Вийти</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">Увійти</a>
        <a href="{% url 'register' %}">Реєстрація</a>
        <a href="{% url 'password_reset' %}">Забули пароль?</a>
    {% endif %}
</nav>

</body>
</html>
