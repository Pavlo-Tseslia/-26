{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Bella Italia | {{ title }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'index' %}">Головна</a>
            <a href="{% url 'menu' %}">Меню</a>
            <a href="{% url 'about' %}">Про нас</a>
            <a href="{% url 'contact' %}">Контакти</a>
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" style="color: #ffd700;">Кабінет ({{ user.username }})</a>
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:none; border:none; color:white; cursor:pointer; font-weight:bold;">ВИЙТИ</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Увійти</a>
            {% endif %}
            <a href="{% url 'view_cart' %}">🛒 Кошик</a>
        </nav>
    </header>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p>&copy; 2026 Bella Italia - Справжня італійська кухня. Всі права захищені.</p>
    </footer>
</body>
</html>
